name: Check formulae artifact

# Cron stage: polls Homebrew's github-pages artifact and rolls .version forward.
# Ported from .crow/sync.yml (CrowCI). A push of .version triggers sync.yml.
on:
    schedule:
        - cron: "*/20 * * * *"
    workflow_dispatch: {}

jobs:
    check:
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Check for new artifact
              env:
                  GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
              run: sh .forgejo/scripts/sync.sh

            - name: Commit and push
              run: |
                  set -eu

                  git config user.name  "Forgejo"
                  git config user.email "forgejo@users.noreply.local"

                  git add .version
                  if git diff --cached --quiet; then
                    echo "no change"
                    exit 0
                  fi

                  git commit -m "sync: artifact #$(cat .version)"

                  # Retry in case another run pushed to main first.
                  for attempt in 1 2 3; do
                    if git pull --rebase --autostash origin main && git push origin HEAD:main; then
                      exit 0
                    fi
                    echo "push attempt ${attempt} failed, retrying"
                    sleep 5
                  done
                  exit 1
