name: Dispatch GitHub cleanup-hidden workflow
skip_clone: true

when:
  - event: cron
    cron: cleanup-hidden
  - event: manual

steps:
  - name: dispatch-workflow
    image: docker.io/library/alpine:3.22
    environment:
      GH_TOKEN:
        from_secret: github_token
      GITHUB_REPOSITORY:
        from_secret: github_repository
      GITHUB_REF: main
    commands:
      - apk add --no-cache github-cli
      - |
        repo_path=$(printf '%s' "$${GITHUB_REPOSITORY}" | tr -d '\r\n')
        echo "Dispatching cleanup-hidden.yml to $${repo_path} on ref $${GITHUB_REF}"
        gh workflow run cleanup-hidden.yml --repo "$repo_path" --ref "$${GITHUB_REF}"
