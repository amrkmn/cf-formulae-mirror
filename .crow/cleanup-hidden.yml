name: Dispatch GitHub cleanup-hidden workflow
skip_clone: true

when:
  - event: cron
    cron: cleanup-hidden
  - event: manual

steps:
  - name: dispatch-workflow
    image: curlimages/curl:8.20.0
    environment:
      GITHUB_TOKEN:
        from_secret: github_token
      GIT_REMOTE:
        from_secret: git_remote
      GITHUB_REF: main
    commands:
      - >-
        repo_path="$${GIT_REMOTE#https://github.com/}";
        repo_path="$${repo_path%.git}";
        payload=$(printf '{"ref":"%s"}' "$${GITHUB_REF}");
        curl --fail-with-body --silent --show-error
        -X POST
        -H "Accept: application/vnd.github+json"
        -H "Authorization: Bearer $${GITHUB_TOKEN}"
        -H "X-GitHub-Api-Version: 2022-11-28"
        "https://api.github.com/repos/$${repo_path}/actions/workflows/cleanup-hidden.yml/dispatches"
        -d "$${payload}"
