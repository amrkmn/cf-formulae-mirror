when:
    - event: cron
      cron: sync
      branch: main
    - event: manual
      branch: main

clone:
    - name: clone
      image: quay.io/amrkmn/crow/clone:1
      settings:
          partial: false

steps:
    - name: check-sync
      image: docker.io/library/alpine:3.22
      environment:
          GITHUB_TOKEN:
              from_secret: github_token
      commands:
          - |
              set -eu
              trap 'rc=$?; if [ "$rc" -eq 0 ]; then echo "check-sync: success"; else echo "check-sync: failed ($rc)"; fi' EXIT
              apk add --no-cache curl jq >/dev/null
              sh .crow/scripts/sync.sh

    - name: commit-and-push
      image: docker.io/library/alpine:3.22
      depends_on: [check-sync]
      environment:
          FORGEJO_SSH_KEY:
              from_secret: forgejo_ssh_key
          FORGEJO_REMOTE:
              from_secret: forgejo_remote
      commands:
          - |
              set -eu
              export GIT_SSH_COMMAND="ssh -o StrictHostKeyChecking=accept-new"

              STATUS="success"
              trap 'rc=$?; if [ "$rc" -eq 0 ]; then echo "commit-and-push: $STATUS"; else echo "commit-and-push: failed ($rc)"; fi' EXIT

              apk add --no-cache git openssh-client >/dev/null

              git config user.name  "CrowCI"
              git config user.email "crowci@users.noreply.local"

              mkdir -p ~/.ssh && chmod 700 ~/.ssh
              printf '%s\n' "$FORGEJO_SSH_KEY" > ~/.ssh/id_ed25519
              chmod 600 ~/.ssh/id_ed25519

              git remote set-url origin "$FORGEJO_REMOTE"
              git add .version

              if git diff --cached --quiet; then
                STATUS="skipped (no change)"
                exit 0
              fi

              git commit -m "sync: artifact #$(cat .version)"
              git pull --rebase --autostash origin main
              git push origin HEAD:main
